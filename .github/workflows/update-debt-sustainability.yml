name: Update debt sustainability data
on:
  schedule:
    - cron: '35 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve official Eurostat series
        run: python scripts/update_debt_sustainability.py
      - name: Publish data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/debt-sustainability.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh debt sustainability indicators"
            git push
          fi
