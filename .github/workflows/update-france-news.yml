name: Update France news and politics
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_france_news.py'
      - '.github/workflows/update-france-news.yml'
  schedule:
    - cron: '20 7,12,17,21 * * *'
  workflow_dispatch:
    inputs:
      sentiment_date:
        description: "Optional UTC date (YYYY-MM-DD) to recalculate historical sentiment"
        required: false
        type: string
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect France sovereign-risk headlines
        run: python scripts/update_france_news.py
      - name: Install article extraction and sentiment dependencies
        run: pip install trafilatura==2.0.0 transformers==4.46.3 torch==2.5.1 gnews-decoder
      - name: Calculate daily article-text sentiment
        continue-on-error: true
        env:
          SENTIMENT_DATE: ${{ inputs.sentiment_date }}
        run: python scripts/update_france_risk_tone.py
      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/france-news.json data/france-risk-tone.json data/ratings-watch.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh France sovereign-risk news"
            git push
          fi
