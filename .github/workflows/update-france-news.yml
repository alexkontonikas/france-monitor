name: Update France news and politics
on:
  schedule:
    - cron: '20 7,12,17,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect France sovereign-risk headlines
        run: python scripts/update_france_news.py
      - name: Install article extraction and sentiment dependencies
        run: pip install trafilatura==2.0.0 vaderSentiment==3.3.2
      - name: Calculate daily article-text sentiment
        run: python scripts/update_france_risk_tone.py
      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/france-news.json data/france-risk-tone.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh France sovereign-risk news"
            git push
          fi
