name: Update sovereign bond data
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8,12,16,19 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and validate yields
        run: python scripts/update_bonds.py
      - name: Refresh five-year Eurostat monthly history
        run: python scripts/update_bonds_monthly.py
      - name: Refresh month-end history from daily Eurostat observations
        run: python scripts/update_bonds_month_end.py
      - name: Publish only when verified
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bonds.json data/bonds-history.json data/bonds-monthly.json data/bonds-month-end.json
          if ! git diff --cached --quiet; then
            git commit -m "Update sovereign bond observations"
            git push
          fi
